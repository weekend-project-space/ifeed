<svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        role="img"
        aria-label="kiwi"
        focusable="false"
>
    <!-- 外形 -->
    <circle cx="12" cy="12" r="9" />

    <!-- 果肉内圈（识别关键） -->
