#  BGE-M3 Ranker 模型分类提示词
#    基础类别
TECH: 这是一篇优质的科技文章，包含有价值的技术资讯、开发工具、编程技巧、行业动态、产品评测或实用教程，内容准确专业，对技术从业者和科技爱好者有重要参考价值
NEWS: 这是一篇优质的时事新闻，报道及时准确、信息来源可靠、事实陈述清晰、背景介绍完整，对读者了解时政、社会、突发事件有重要参考价值
BUSINESS: 这是一篇优质的商业文章，提供了有价值的商业洞察、行业分析、创业经验、企业管理或经营策略，观点有深度、数据支撑充分，对商业人士和创业者有实际指导意义
FINANCE: 这是一篇优质的财经文章，提供了专业的投资理财、股市分析、金融市场、经济政策或财富管理内容，分析客观准确，对投资者和财经关注者有重要参考价值
ENTERTAINMENT: 这是一篇优质的娱乐文章，提供了有趣的影视评论、音乐推荐、明星动态、综艺节目或娱乐文化内容，观点独特、内容丰富，对娱乐爱好者有吸引力和参考价值
SPORTS: 这是一篇优质的体育文章，提供了精彩的赛事报道、运动技巧、健身指导、体育资讯或运动员故事，内容专业准确、报道及时，对体育爱好者有重要价值
LIFESTYLE: 这是一篇优质的生活方式文章，提供了实用的生活建议、居家技巧、品质生活、生活态度或生活美学内容，贴近生活、可操作性强，能够提升读者生活品质
#    高频类别
EDUCATION: 这是一篇优质的教育文章，提供了有价值的学习方法、在线课程、教育资讯、考试指南或知识分享，内容实用、逻辑清晰，对学习者和教育工作者有实际帮助
HEALTH: 这是一篇优质的健康文章，提供了科学准确的医疗资讯、养生保健、心理健康、疾病预防或健康知识，来源可靠、内容专业，对关注健康的读者有重要指导价值
FOOD: 这是一篇优质的美食文章，提供了实用的菜谱教程、餐厅推荐、美食文化、食材知识或烹饪技巧，内容详实有趣、图文并茂，能够激发读者的食欲和烹饪兴趣
TRAVEL: 这是一篇优质的旅游文章，提供了详实的旅行攻略、目的地推荐、旅游体验、出行指南或风土人情，内容实用、描述生动，能为旅行者提供有价值的参考信息
CULTURE: 这是一篇优质的文化文章，提供了深刻的文学、艺术、历史、哲学、传统文化或人文思考内容，有深度、视角独特，能够提升读者的文化素养和人文关怀
SCIENCE: 这是一篇优质的科学文章，提供了准确严谨的科普知识、科研成果、自然探索、科学实验或科技前沿内容，通俗易懂、内容可靠，能够激发读者的科学兴趣
DESIGN: 这是一篇优质的设计文章，展示了出色的视觉设计、UI/UX设计、创意思路、设计技巧、设计趋势或作品赏析，内容专业、审美性强，对设计师和创意工作者有启发和参考价值
#    补充类别
AUTO: 这是一篇优质的汽车文章，提供了专业的汽车评测、行业动态、用车知识、购车指南或汽车文化内容，客观准确、信息全面，对车主和汽车爱好者有重要参考价值
FASHION: 这是一篇优质的时尚文章，提供了前沿的服装穿搭、潮流趋势、美妆护肤、时尚资讯或风格指南，内容时尚、实用性强，能够为读者提供穿搭灵感和时尚建议
CAREER: 这是一篇优质的职场文章，提供了实用的求职技巧、职业规划、职场经验、面试指南或职业发展建议，内容针对性强、可操作性高，对职场人士有实际帮助
GAMING: 这是一篇优质的游戏文章，提供了详细的游戏攻略、游戏评测、电竞资讯、游戏文化或玩家心得，内容专业有趣、信息准确，对游戏玩家有重要参考价值
OPINION: 这是一篇优质的观点评论文章，提供了深刻的时事分析、观点表达、思想探讨或专栏评论，观点鲜明、论证充分，能够引发读者深入思考和理性讨论
#    兜底类别
OTHER: 这是一篇优质的文章，虽然无法明确归入上述特定分类，但内容质量高、信息有价值，包括跨领域内容、小众话题或创新形式，对相关读者有一定参考价值