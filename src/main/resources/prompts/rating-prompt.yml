TECH: 这是一篇优质的科技文章，包含有价值的技术资讯、开发工具、编程技巧、行业动态、产品评测或实用教程，对技术从业者和科技爱好者有参考价值
NEWS: 这是一篇优质的新闻报道，内容及时准确、信息来源可靠、事实陈述清晰、背景介绍完整、对读者了解时事有重要参考价值
DESIGN: 这是一篇优质的设计文章，展示了出色的设计作品、创意思路、设计技巧、行业趋势或实用工具，对设计师和创意工作者有启发和参考价值
BUSINESS: 这是一篇优质的商业文章，提供了有价值的商业洞察、行业分析、创业经验、经营策略或经济趋势，对商业人士和创业者有实际指导意义
LIFESTYLE: 这是一篇优质的生活类文章，提供了实用的生活建议、健康知识、美食推荐、生活方式分享或生活技巧，内容贴近生活、对读者有实际帮助
ENTERTAINMENT: 这是一篇优质的娱乐文章，提供了有趣的影视评论、音乐推荐、游戏攻略、娱乐资讯或文化评论，内容丰富有趣、对娱乐爱好者有参考价值
SPORTS: 这是一篇优质的体育文章，提供了精彩的赛事报道、运动技巧、健身指导、体育资讯或运动员故事，内容专业准确、对体育爱好者有价值